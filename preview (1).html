<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gooony Goon Webhook</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;

      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      background: #111214;
      color: #f2f3f5;
    }

    .card {
      width: min(520px, 100%);
      padding: 28px;

      background: #1e1f22;
      border: 1px solid #303238;
      border-radius: 18px;

      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #b5bac1;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: 650;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #3b3e45;
      border-radius: 10px;

      background: #111214;
      color: #f2f3f5;

      padding: 12px 13px;
      font: inherit;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #5865f2;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;

      border: 0;
      border-radius: 10px;
      padding: 13px;

      font: inherit;
      font-weight: 750;

      cursor: pointer;

      background: #5865f2;
      color: white;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      min-height: 22px;
      margin-top: 14px;

      text-align: center;
      color: #b5bac1;
    }

    .note {
      margin-top: 18px;

      font-size: 12px;
      line-height: 1.45;

      color: #8e929a;
    }
  </style>
</head>

<body>

  <main class="card">

    <h1>gooony goon webhook</h1>

    <p class="subtitle">
      Type a message and send it straight to Discord.
    </p>

    <label for="webhook">
      Webhook URL
    </label>

    <input
      id="webhook"
      type="url"
      placeholder="https://discord.com/api/webhooks/..."
      autocomplete="off"
      spellcheck="false"
    >

    <label for="message">
      Message
    </label>

    <textarea
      id="message"
      placeholder="Type your message..."
      maxlength="2000"
    ></textarea>

    <button id="sendButton" type="button">
      SEND
    </button>

    <div id="status" aria-live="polite"></div>

    <div class="note">
      The webhook URL is only kept in this page's memory and isn't saved by the site.
      Keep webhook URLs private because anyone who has one can send messages through it.
    </div>

  </main>

  <script>

    // The avatar you provided
    const AVATAR_URL =
      "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcShVQ3a1yb9MfU7-RlStcKPIgwMw4-afLY7qw&s";


    const webhookInput = document.getElementById("webhook");
    const messageInput = document.getElementById("message");
    const sendButton = document.getElementById("sendButton");
    const status = document.getElementById("status");


    function setStatus(text) {
      status.textContent = text;
    }


    async function sendMessage() {

      const webhook = webhookInput.value.trim();
      const message = messageInput.value;


      if (!webhook) {
        setStatus("Paste a webhook URL first.");
        webhookInput.focus();
        return;
      }


      if (!message.trim()) {
        setStatus("Type a message first.");
        messageInput.focus();
        return;
      }


      // Basic check to make sure it's actually a Discord webhook
      if (
        !/^https:\/\/(discord\.com|discordapp\.com)\/api\/webhooks\//i.test(webhook)
      ) {
        setStatus("That doesn't look like a Discord webhook URL.");
        return;
      }


      sendButton.disabled = true;
      setStatus("Sending...");


      try {

        const response = await fetch(webhook, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            // Your custom avatar
            avatar_url: AVATAR_URL,

            // Whatever you typed
            content: message

          })

        });


        if (!response.ok) {
          throw new Error(
            `Discord returned HTTP ${response.status}`
          );
        }


        setStatus("Sent 👍");

        messageInput.value = "";
        messageInput.focus();


      } catch (error) {

        console.error(error);

        setStatus(
          "Couldn't send it. Check the webhook URL and try again."
        );

      } finally {

        sendButton.disabled = false;

      }

    }


    // Send button
    sendButton.addEventListener(
      "click",
      sendMessage
    );


    messageInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

  </script>

</body>
</html>
